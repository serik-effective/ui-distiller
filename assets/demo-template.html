<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PATTERN NAME — UI Distiller</title>
<style>
  /* ---------------------------------------------------------------
     Tunable parameters — the point of the demo. Keep them here, named,
     and wired to the controls below.
  --------------------------------------------------------------- */
  :root {
    --duration: 800ms;
    --stagger: 70ms;
    --distance: 110%;
    --ease: cubic-bezier(.16, 1, .3, 1);

    --bg: #0c0c0e;
    --fg: #f2f2f4;
    --muted: #8a8a95;
    --line: #26262c;
    --accent: #7a5cff;
    --panel: #131318;
  }
  :root[data-theme="light"] {
    --bg: #f6f6f4; --fg: #101014; --muted: #6b6b76;
    --line: #dfdfd9; --accent: #4a30d8; --panel: #fff;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 400 15px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: grid; grid-template-rows: auto 1fr auto; min-height: 100dvh;
  }

  /* --- chrome --------------------------------------------------- */
  header {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    padding: 14px 20px; border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 14px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
  header .meta { color: var(--muted); font-size: 12px; }
  header .spacer { flex: 1; }
  .btn {
    font: inherit; font-size: 12px; color: var(--fg); background: transparent;
    border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; cursor: pointer;
  }
  .btn:hover { border-color: var(--fg); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* --- stage: the pattern lives here ---------------------------- */
  .stage {
    position: relative; overflow: hidden;
    display: grid; place-items: center; padding: 48px 24px;
  }

  /* --- controls ------------------------------------------------- */
  .controls {
    border-top: 1px solid var(--line); background: var(--panel);
    display: flex; gap: 20px; flex-wrap: wrap; align-items: center;
    padding: 12px 20px; font-size: 12px;
  }
  .ctrl { display: flex; align-items: center; gap: 8px; }
  .ctrl label { color: var(--muted); white-space: nowrap; }
  .ctrl input[type="range"] { width: 120px; accent-color: var(--accent); }
  .ctrl output { font-variant-numeric: tabular-nums; min-width: 58px; }
  .hint { color: var(--muted); margin-left: auto; }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 1ms !important; transition-duration: 1ms !important; }
  }
</style>
</head>
<body>

<header>
  <h1>PATTERN NAME</h1>
  <span class="meta">category · trigger: TRIGGER</span>
  <span class="spacer"></span>
  <button class="btn" id="replay">Replay</button>
  <button class="btn" id="theme">Theme</button>
</header>

<!-- ================= STAGE ================= -->
<main class="stage" id="stage">
  <!-- Minimal placeholder UI. Neutral content only — no branding, no site copy. -->
  <p>Replace with the isolated pattern.</p>
</main>
<!-- ========================================= -->

<div class="controls" id="controls">
  <!-- data-var binds the slider to a :root custom property -->
  <div class="ctrl">
    <label for="c-duration">duration</label>
    <input id="c-duration" type="range" min="100" max="2000" step="50" value="800" data-var="--duration" data-unit="ms">
    <output for="c-duration">800ms</output>
  </div>
  <div class="ctrl">
    <label for="c-stagger">stagger</label>
    <input id="c-stagger" type="range" min="0" max="200" step="5" value="70" data-var="--stagger" data-unit="ms">
    <output for="c-stagger">70ms</output>
  </div>
  <div class="ctrl">
    <label for="c-distance">distance</label>
    <input id="c-distance" type="range" min="0" max="200" step="5" value="110" data-var="--distance" data-unit="%">
    <output for="c-distance">110%</output>
  </div>
  <span class="hint">TRIGGER HINT — e.g. hover a card, or scroll the stage</span>
</div>

<script>
/* ---------------------------------------------------------------
   Demo shell: parameter binding, theme, replay. Pattern code below.
--------------------------------------------------------------- */
const root = document.documentElement;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

document.querySelectorAll('#controls input[data-var]').forEach(input => {
  const out = document.querySelector(`output[for="${input.id}"]`);
  const apply = () => {
    const v = input.value + (input.dataset.unit || '');
    root.style.setProperty(input.dataset.var, v);
    if (out) out.textContent = v;
  };
  input.addEventListener('input', apply);
  apply();
});

document.getElementById('theme').addEventListener('click', () => {
  root.dataset.theme = root.dataset.theme === 'light' ? 'dark' : 'light';
});

/* ---------------------------------------------------------------
   PATTERN
--------------------------------------------------------------- */
const CONFIG = {
  // JS-side parameters that are not CSS custom properties
  lerp: 0.12,
};

const lerp = (a, b, t) => a + (b - a) * t;

function play() {
  // Run / restart the pattern. Must be idempotent — Replay calls it repeatedly.
}

document.getElementById('replay').addEventListener('click', play);
play();
</script>
</body>
</html>
