><script>const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));const mix=(a,b,p)=>a+(b-a)*p;const ease=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];$('#theme').onclick=()=>{document.body.dataset.theme=document.body.dataset.theme==='dark'?'light':'dark'};$('#replay').onclick=()=>{window.scrollTo(0,0);if(window.resetDemo)window.resetDemo()};function scrollProgress(el){return clamp(-el.getBoundingClientRect().top/(el.offsetHeight-innerHeight+60))}function announce(t){$('#status').textContent=t}function paint(ctx,w,h,seed=0){ctx.fillStyle=['#c0d9c7','#d7c1a6','#b8b7d8','#d1cbad'][seed%4];ctx.fillRect(0,0,w,h);ctx.save();ctx.translate(w*.48,h*.5);ctx.rotate(-.4-seed*.12);for(let i=-12;i<13;i++){ctx.fillStyle=i%2?'#35594b':'#769687';ctx.fillRect(i*w*.035,-h,w*.017,h*2)}ctx.restore();const g=ctx.createLinearGradient(0,0,w,h);g.addColorStop(0,'#fff7e7');g.addColorStop(.45,'#95afa1');g.addColorStop(.8,'#dae5d8');g.addColorStop(1,'#667e77');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(w*.68,h*.54,w*.36,h*.22,.45,0,Math.PI*2);ctx.fill();ctx.font=(h*.18)+'px Georgia';ctx.fillStyle='#ffffffbb';ctx.fillText('0'+(seed+1),w*.06,h*.94)}
const CONFIG={perspective:2.62,angle:24,depth:.7,drift:4,gap:.06};const cards=$$('.arc-card'),stage=$('.arc');function render(){const p=scrollProgress($('.scroll-run'));const move=ease(clamp(p/.62));const zoom=ease(clamp((p-.62)/.38));const w=clamp(innerWidth*.20,170,300),h=w*.72,dist=CONFIG.perspective*w;const center=4-CONFIG.drift*(1-move);const offsets=cards.map((_,i)=>i-center);const edges=offsets.map(d=>{const a=-d*CONFIG.angle*Math.PI/180,z=CONFIG.depth*w*(Math.sqrt(d*d+.35*.35)-.35);return{left:w/2*Math.cos(a)*dist/Math.max(dist-z-w/2*Math.sin(a),dist*.15),right:w/2*Math.cos(a)*dist/Math.max(dist-z+w/2*Math.sin(a),dist*.15)}});const positions=[0];for(let i=1;i<cards.length;i++)positions[i]=positions[i-1]+edges[i-1].right+w*CONFIG.gap+edges[i].left;const ii=Math.floor(center),shift=mix(positions[ii],positions[Math.min(ii+1,8)],center-ii);cards.forEach((el,i)=>{const d=offsets[i],selected=i===4,scale=selected?zoom:0,z=CONFIG.depth*w*(Math.sqrt(d*d+.1225)-.35);el.style.width=mix(w,Math.min(innerWidth*.86,1100),scale)+'px';el.style.height=mix(h,stage.clientHeight*.8,scale)+'px';el.style.transform='translate(-50%,-50%) translateX('+((positions[i]-shift)*(1-scale))+'px) perspective('+dist+'px) translateZ('+(z*(1-scale))+'px) rotateY('+(-d*CONFIG.angle*(1-scale))+'deg)';el.style.opacity=selected?'1':String(clamp(3.1-Math.abs(d))* (1-zoom));el.style.visibility=Math.abs(d)>3.1?'hidden':'visible';el.style.filter=selected?'none':'blur('+(zoom*18)+'px)';el.style.zIndex=selected?'10':String(6-Math.round(Math.abs(d)));});$('.heading').style.opacity=1-zoom;$('.meter').textContent='Прогресс '+Math.round(p*100)+'%'}addEventListener('scroll',render,{passive:true});addEventListener('resize',render);window.resetDemo=render;render();</script></body></html>
