const CONFIG={columns:22,rows:16,spring:.085,damping:.84,radius:180,force:40};const canvas=$('canvas'),ctx=canvas.getContext('2d'),texture=document.createElement('canvas');texture.width=880;texture.height=660;paint(texture.getContext('2d'),880,660);let layers=[],vertices=[],pointer={x:-9999,y:-9999},offset=0,target=0,vel=0,last=performance.now(),width=0,height=0;function resize(){width=canvas.clientWidth;height=canvas.clientHeight;const dpr=Math.min(devicePixelRatio,2);canvas.width=width*dpr;canvas.height=height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);layers=[];for(let card=0;card<3;card++){const layer=[];for(let y=0;y<=CONFIG.rows;y++)for(let x=0;x<=CONFIG.columns;x++)layer.push({x:0,y:0,vx:0,vy:0,u:x/CONFIG.columns,v:y/CONFIG.rows});layers.push(layer)}if(reduced)frame(performance.now())}function triangle(a,b,c){const sx=[a.u*880,b.u*880,c.u*880],sy=[a.v*660,b.v*660,c.v*660],dx=[a.dx,b.dx,c.dx],dy=[a.dy,b.dy,c.dy];const den=sx[0]*(sy[1]-sy[2])+sx[1]*(sy[2]-sy[0])+sx[2]*(sy[0]-sy[1]);function coeff(v){return[(v[0]*(sy[1]-sy[2])+v[1]*(sy[2]-sy[0])+v[2]*(sy[0]-sy[1]))/den,(v[0]*(sx[2]-sx[1])+v[1]*(sx[0]-sx[2])+v[2]*(sx[1]-sx[0]))/den,(v[0]*(sx[1]*sy[2]-sx[2]*sy[1])+v[1]*(sx[2]*sy[0]-sx[0]*sy[2])+v[2]*(sx[0]*sy[1]-sx[1]*sy[0]))/den]}const x=coeff(dx),y=coeff(dy);ctx.save();ctx.beginPath();ctx.moveTo(a.dx,a.dy);ctx.lineTo(b.dx,b.dy);ctx.lineTo(c.dx,c.dy);ctx.closePath();ctx.clip();ctx.transform(x[0],y[0],x[1],y[1],x[2],y[2]);ctx.drawImage(texture,0,0);ctx.restore()}function frame(t){const dt=Math.min(2.5,(t-last)/16.667);last=t;const previous=offset;offset=mix(offset,target,reduced?1:.09);vel=offset-previous;ctx.clearRect(0,0,width,height);const w=Math.min(width*.55,680),h=w*.75,gap=w+width*.18,cycle=gap*3;for(let card=0;card<3;card++){vertices=layers[card];let left=((card*gap+offset+cycle*20)%cycle)-gap*.55;if(left>width+w)left-=cycle;const y0=(height-h)/2;for(const v of vertices){const rx=left+v.u*w,ry=y0+v.v*h;const xx=rx+v.x-pointer.x,yy=ry+v.y-pointer.y,dist=Math.hyp
