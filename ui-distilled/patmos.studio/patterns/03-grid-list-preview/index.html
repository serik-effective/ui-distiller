const CONFIG={duration:650,offset:20};const cards=$$('.project'),root=$('.view-demo'),preview=$('.preview');function change(mode){const before=cards.map(c=>c.getBoundingClientRect());root.dataset.view=mode;$('#image').setAttribute('aria-pressed',mode==='image');$('#text').setAttribute('aria-pressed',mode==='text');cards.forEach((c,i)=>{const a=before[i],b=c.getBoundingClientRect();if(!reduced)c.animate([{transform:'translate('+ (a.x-b.x)+'px,'+(a.y-b.y)+'px)'},{transform:'none'}],{duration:CONFIG.duration,easing:'cubic-bezier(.2,0,.2,1)'})});preview.classList.remove('on');announce(mode==='text'?'Текстовый индекс':'Сетка изображений')}$('#image').onclick=()=>change('image');$('#text').onclick=()=>change('text');cards.forEach(c=>{function show(e){if(root.dataset.view!=='text')return;preview.innerHTML=c.querySelector('.thumb').innerHTML;preview.classList.add('on');const r=c.getBoundingClientRect();const x=e.clientX||innerWidth*.55,y=e.clientY||r.y;preview.style.transform='translate('+clamp(x+CONFIG.offset,10,innerWidth-preview.offsetWidth-10)+'px,'+clamp(y+CONFIG.offset,70,innerHeight-preview.offsetHeight-10)+'px)'}c.onpointermove=show;c.onfocus=show;c.onpointerleave=c.onblur=()=>preview.classList.remove('on');c.onclick=e=>e.preventDefault()});window.resetDemo=()=>change('image');</script></body></html>
